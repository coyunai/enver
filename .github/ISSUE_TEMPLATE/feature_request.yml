name: Feature request
description: Suggest a capability for enver
title: "[feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the workflow, not just the desired UI.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like enver to behave? Mention CLI and UI if relevant.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Runtime management
        - Presets and switching
        - Python / virtualenv
        - Packages
        - Storage and migration
        - Diagnostics
        - Terminal
        - CLI
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing tools or workarounds you have tried.
